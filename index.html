<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Timer</title>

<style>
:root {
  --bg: #0f172a;
  --card: #111c33;
  --accent: #4f46e5;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --danger: #ef4444;
  --success: #22c55e;
}

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 900px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

h1 {
  font-size: 20px;
}

.card {
  background: var(--card);
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

input, button, select {
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

input, select {
  width: 100%;
  margin-bottom: 10px;
  background: #0b1220;
  color: var(--text);
}

button {
  cursor: pointer;
  background: var(--accent);
  color: white;
  transition: 0.2s;
}

button:hover {
  opacity: 0.85;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.boss {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  background: #0b1220;
  border-radius: 10px;
  margin-bottom: 10px;
}

.boss-info {
  display: flex;
  flex-direction: column;
}

.small {
  font-size: 12px;
  color: var(--muted);
}

.actions button {
  margin-left: 5px;
  background: #1f2a44;
}

.actions button:hover {
  background: var(--accent);
}

.danger {
  background: var(--danger) !important;
}

.success {
  background: var(--success) !important;
}

.volume {
  width: 100%;
}

</style>
</head>

<body>

<div class="container">

<header>
  <h1>⚔️ Boss Timer System</h1>
</header>

<!-- ADD BOSS -->
<div class="card">
  <h3>Add Boss</h3>

  <input id="bossName" placeholder="Boss name">

  <div class="grid">
    <input id="spawnTime" type="number" placeholder="Spawn time (minutes)">
    <input id="repeatTime" type="number" placeholder="Repeat timer (minutes)">
  </div>

  <button onclick="addBoss()">Add Boss</button>
</div>

<!-- SETTINGS -->
<div class="card">
  <h3>Settings</h3>
  <label class="small">Alarm Volume</label>
  <input type="range" min="0" max="1" step="0.01" value="0.5" class="volume" id="volume" oninput="setVolume(this.value)">
</div>

<!-- LIST -->
<div class="card">
  <h3>Boss List</h3>
  <div id="bossList"></div>
</div>

</div>

<audio id="alarm">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<script>
let bosses = JSON.parse(localStorage.getItem("bosses") || "[]");
let volume = 0.5;
const alarm = document.getElementById("alarm");

function save() {
  localStorage.setItem("bosses", JSON.stringify(bosses));
  render();
}

function addBoss() {
  const name = document.getElementById("bossName").value;
  const spawn = parseInt(document.getElementById("spawnTime").value);
  const repeat = parseInt(document.getElementById("repeatTime").value);

  if (!name || !spawn || !repeat) return;

  bosses.push({
    id: Date.now(),
    name,
    spawn,
    repeat,
    nextSpawn: Date.now() + spawn * 60000
  });

  save();
}

function editBoss(id) {
  const b = bosses.find(x => x.id === id);
  const newName = prompt("Edit name", b.name);
  const newSpawn = prompt("Edit spawn (min)", b.spawn);
  const newRepeat = prompt("Edit repeat (min)", b.repeat);

  if (newName) b.name = newName;
  if (newSpawn) b.spawn = parseInt(newSpawn);
  if (newRepeat) b.repeat = parseInt(newRepeat);

  save();
}

function deleteBoss(id) {
  bosses = bosses.filter(b => b.id !== id);
  save();
}

function killBoss(id) {
  const b = bosses.find(x => x.id === id);
  b.nextSpawn = Date.now() + b.repeat * 60000;
  playAlarm();
  save();
}

function playAlarm() {
  alarm.volume = volume;
  alarm.currentTime = 0;
  alarm.play();
}

function setVolume(v) {
  volume = v;
}

function updateTimers() {
  const now = Date.now();

  bosses.forEach(b => {
    if (now >= b.nextSpawn) {
      playAlarm();
      b.nextSpawn = now + b.repeat * 60000;
    }
  });

  render();
}

function formatTime(ms) {
  const diff = ms - Date.now();
  if (diff <= 0) return "NOW";

  const m = Math.floor(diff / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  return `${m}m ${s}s`;
}

function render() {
  const list = document.getElementById("bossList");
  list.innerHTML = "";

  bosses.forEach(b => {
    const div = document.createElement("div");
    div.className = "boss";

    div.innerHTML = `
      <div class="boss-info">
        <strong>${b.name}</strong>
        <span class="small">Next spawn: ${formatTime(b.nextSpawn)}</span>
      </div>

      <div class="actions">
        <button class="success" onclick="killBoss(${b.id})">Killed</button>
        <button onclick="editBoss(${b.id})">Edit</button>
        <button class="danger" onclick="deleteBoss(${b.id})">X</button>
      </div>
    `;

    list.appendChild(div);
  });
}

setInterval(updateTimers, 1000);
render();
</script>

</body>
</html>
